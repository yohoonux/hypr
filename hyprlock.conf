general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(30, 30, 46) 
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%I:%M %p')"
    color = rgb(180, 190, 254)
    font_size = 80
    font_family = JetBrains Mono Nerd Font ExtraBold

    position = 0, 288
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%a, %b %d')"
    color = rgb(180, 190, 254)
    font_size = 32
    font_family = JetBrains Mono Nerd Font Bold

    position = 0, 188
    halign = center
    valign = center
}

label {
    monitor =
    text = <span foreground='##cba6f7'></span>ㅤㅤㅤ$USER
    size = 256, 32
    font_size = 16
    font_family = JetBrains Mono Nerd Font Propo
    position = 0, -128
    halign = center
    valign = center
    color = rgb(180, 190, 254)
}

label {
    text = <span foreground='##cba6f7'></span>ㅤㅤㅤ$XDG_CURRENT_DESKTOP
    monitor =
    size = 256, 32
    font_family = JetBrains Mono Nerd Font Propo
    position = 0, -64 
    halign = center
    valign = center
    color = rgb(180, 190, 254)
}

input-field {
    monitor =
    size = 384, 40 
    outline_thickness = 0
    font_size = 32
    font_family = JetBrains Mono Nerd Font Propo
    dots_size = 0.2 
    dots_spacing = 0.14
    dots_center = true
    inner_color = rgb(180, 190, 254)
    font_color = rgb(30, 30, 46)
    fade_on_empty = false
    placeholder_text = <i> <span foreground='##11111b'></span>     PASSWORD </i>
    position = 0, -256
    halign = center
    valign = center
    check_color = rgb(203, 166, 247)
    check_text = <span foreground='##11111b'></span>     Authentication
    fail_color = rgb(243, 139, 168)
    fail_text = <i> <span foreground='##11111b'>󰟿</span>     $FAIL! <b>$ATTEMPTSX</b></i>
    capslock_color = rgb(250, 179, 135)
    numlock_color = rgb(250, 179, 135)
}
